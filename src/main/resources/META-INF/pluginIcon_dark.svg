<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">API Generator icon</title>
  <desc id="desc">Blue and violet rounded app tile with ONE CLICK API GENERATOR text, braces, a click ripple, and a yellow cursor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2F7BFF"/>
      <stop offset="100%" stop-color="#6B3FE0"/>
    </linearGradient>
    <filter id="rippleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="176" fill="none" stroke="#64C6FF" stroke-opacity=".55" stroke-width="19"/>

  <!-- Editable title -->
  <g fill="#FFFFFF" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="512" y="148" font-size="58" letter-spacing="5">ONE CLICK</text>
    <text x="512" y="330" font-size="182" letter-spacing="-7">API</text>
    <text x="512" y="465" font-size="96" letter-spacing="-5">GENERATOR</text>
  </g>

  <!-- White code braces -->
  <g fill="#FFFFFF">
    <path d="M406 492H351c-66 0-96 33-96 96v66c0 39-15 59-59 64l-13 2v54l13 2c44 5 59 25 59 64v66c0 63 30 96 96 96h55v-52h-27c-35 0-47-14-47-46v-80c0-54-25-84-75-92v-8c50-8 75-38 75-92v-80c0-32 12-46 47-46h27z"/>
    <path transform="translate(1024 0) scale(-1 1)" d="M406 492H351c-66 0-96 33-96 96v66c0 39-15 59-59 64l-13 2v54l13 2c44 5 59 25 59 64v66c0 63 30 96 96 96h55v-52h-27c-35 0-47-14-47-46v-80c0-54-25-84-75-92v-8c50-8 75-38 75-92v-80c0-32 12-46 47-46h27z"/>
  </g>

  <!-- Click ripple -->
  <g fill="none" stroke="#38E3F2" stroke-width="25" stroke-linecap="round" filter="url(#rippleGlow)">
    <circle cx="512" cy="666" r="164"/>
    <circle cx="512" cy="666" r="111"/>
    <circle cx="512" cy="666" r="58"/>
  </g>
  <circle cx="512" cy="666" r="29" fill="#38E3F2"/>

  <!-- Cursor -->
  <path d="M514 659L680 753L609 780L664 857L615 888L559 807L523 863Z" fill="#FFD43B" stroke="#E1B817" stroke-width="7" stroke-linejoin="round"/>
</svg>
